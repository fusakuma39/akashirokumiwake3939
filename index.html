</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- アイコンコンポーネント (SVG) ---
        const Icons = {
            Grade: () => <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>,
            Class: () => <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>,
            Separate: () => <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
            Mixed: () => <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            Time: () => <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Height: () => <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 14l-7 7m0 0l-7-7m7 7V3" /></svg>,
            Check: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>,
            ArrowRight: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>,
            ArrowLeft: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>,
            Download: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            Settings: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            Sort: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" /></svg>,
            User: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
            Run: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>,
            Users: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            Info: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Shield: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
        };

        // --- 共通コンポーネント: 選択カード (Green Theme) ---
        const SelectionCard = ({ selected, onClick, icon: Icon, title, desc, color = "green" }) => {
            const baseClass = "cursor-pointer rounded-xl border-2 p-4 flex flex-col items-center gap-3 transition-all duration-200 w-full";
            const activeClass = selected 
                ? `border-${color}-500 bg-${color}-50 text-${color}-700 shadow-md transform scale-[1.02]` 
                : "border-slate-200 bg-white text-slate-500 hover:border-slate-300 hover:bg-slate-50";
            
            return (
                <div onClick={onClick} className={`${baseClass} ${activeClass}`}>
                    <div className={selected ? `text-${color}-600` : "text-slate-400"}>
                        <Icon />
                    </div>
                    <div className="text-center">
                        <div className="font-bold text-lg leading-tight">{title}</div>
                        {desc && <div className="text-xs mt-1 opacity-80">{desc}</div>}
                    </div>
                    {selected && <div className={`absolute top-2 right-2 text-${color}-500`}><Icons.Check /></div>}
                </div>
            );
        };

        // パスワードモーダル
        const PasswordModal = ({ show, onClose, onSuccess }) => {
            const [inputVal, setInputVal] = useState('');
            const [error, setError] = useState('');
            const inputRef = useRef(null);

            useEffect(() => {
                if (show && inputRef.current) {
                    inputRef.current.focus();
                }
            }, [show]);

            if (!show) return null;

            const handleExecute = () => {
                if (inputVal === SECRET_KEY) {
                    onSuccess();
                } else {
                    setError('合言葉が違います');
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') handleExecute();
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 animate-fade-in">
                    <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full mx-4" onClick={e => e.stopPropagation()}>
                        <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.Shield/> 合言葉</h3>
                        <p className="text-sm text-slate-600 mb-4">合言葉を入力してください。</p>
                        <input ref={inputRef} type="text" className="w-full border-2 border-slate-200 rounded-lg p-3 mb-2 focus:border-green-500 focus:outline-none" placeholder="合言葉" value={inputVal} onChange={(e) => setInputVal(e.target.value)} onKeyDown={handleKeyDown} />
                        {error && <p className="text-red-500 text-xs font-bold mb-4">{error}</p>}
                        <div className="flex justify-end gap-3 mt-4">
                            <button onClick={onClose} className="text-slate-500 font-bold px-4 py-2 hover:bg-slate-100 rounded-lg">キャンセル</button>
                            <button onClick={handleExecute} className="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-2 rounded-lg shadow-md">実行</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 定数・サンプルデータ ---
        const PATTERNS = [
            { id: 'abba', name: '赤 白 白 赤', sub: 'ジグザグ・赤始', desc: '1位:赤, 2位:白, 3位:白, 4位:赤...' },
            { id: 'baab', name: '白 赤 赤 白', sub: 'ジグザグ・白始', desc: '1位:白, 2位:赤, 3位:赤, 4位:白...' },
            { id: 'abab', name: '赤 白 赤 白', sub: '順送り・赤始', desc: '1位:赤, 2位:白, 3位:赤, 4位:白...' },
            { id: 'baba', name: '白 赤 白 赤', sub: '順送り・白始', desc: '1位:白, 2位:赤, 3位:白, 4位:赤...' },
        ];

        const SAMPLE_DATA = `佐藤太郎	1	男	8.5	142.5	
鈴木一郎	1	男	7.8	145.0	
高橋健太	1	男	9.1	138.5	
田中大輔	1	男	8.3	140.0	
伊藤翔	1	男	7.5	148.0	赤
渡辺拓海	1	男	8.9	135.5	
山本涼太	1	男	9.5	132.0	
中村陸	1	男	8.0	144.5	
小林蓮	1	男	8.6	139.0	
加藤陽向	1	男	9.0	136.0	
佐藤花子	1	女	9.2	135.0	
鈴木愛	1	女	8.8	140.5	
高橋結衣	1	女	9.5	130.0	
田中美咲	1	女	8.5	142.0	
伊藤葵	1	女	8.0	146.0	
渡辺凛	1	女	9.8	128.5	
山本さくら	1	女	9.0	138.0	白
中村優奈	1	女	8.7	141.5	
小林陽菜	1	女	9.3	133.0	
加藤美優	1	女	8.9	139.5	
吉田大輝	2	男	8.2	141.0	
山田蒼大	2	男	7.9	146.5	
佐々木瑛太	2	男	8.8	137.0	
山口樹	2	男	8.4	143.0	
松本湊	2	男	7.6	149.0	
井上悠真	2	男	9.2	134.5	
木村朝陽	2	男	9.4	131.0	
林大翔	2	男	8.1	145.0	
斎藤新	2	男	8.7	138.0	
清水颯太	2	男	9.1	135.5	
吉田結菜	2	女	9.1	136.0	
山田莉子	2	女	8.6	143.0	
佐々木芽依	2	女	9.4	131.5	
山口心春	2	女	8.4	144.0	
松本美月	2	女	8.1	147.5	
井上心優	2	女	9.7	129.0	
木村愛莉	2	女	8.9	139.0	
林杏奈	2	女	8.8	140.0	
斎藤澪	2	女	9.3	134.0	
清水彩葉	2	女	9.0	137.5	`;

        /* 合言葉見つかっちゃった！降参！ご自由にお使いください。 */
        const SECRET_KEY = "ウンドウカイ";

        const App = () => {
            const [step, setStep] = useState(1);
            
            // Step 1: 基本条件
            const [grouping, setGrouping] = useState('grade'); 
            const [mode, setMode] = useState('separate'); 
            const [criteria, setCriteria] = useState('time'); 
            
            // Step 2: ルール
            const [ruleBoy, setRuleBoy] = useState('abba');
            const [ruleGirl, setRuleGirl] = useState('baab');

            // Step 3: データ
            const [rawInput, setRawInput] = useState('');
            const [teamData, setTeamData] = useState([]); 
            const [showPasswordModal, setShowPasswordModal] = useState(false);

            // Step 5: 出力設定
            const [raceEnabled, setRaceEnabled] = useState(true);
            const [raceMode, setRaceMode] = useState('separate');
            const [runnersPerRace, setRunnersPerRace] = useState(5);
            
            const [lineupEnabled, setLineupEnabled] = useState(true);
            const [lineupGrouping, setLineupGrouping] = useState('class');
            const [lineupMode, setLineupMode] = useState('separate');
            const [lineupColumns, setLineupColumns] = useState(2);

            // Step 6: 最終データ
            const [raceList, setRaceList] = useState([]);
            const [lineupList, setLineupList] = useState([]);

            useEffect(() => { window.scrollTo(0, 0); }, [step]);

            // --- Logic ---
            const downloadTemplate = () => {
                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const header = "氏名,クラス,性別,タイム,身長,チーム指定(任意)\n";
                const row1 = "佐藤太郎,1,男,8.5,140.5,\n";
                const row2 = "鈴木花子,1,女,9.2,138.0,赤\n";
                const blob = new Blob([bom, header + row1 + row2], { type: "text/csv" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "組み分け入力用テンプレート.csv";
                a.click();
                URL.revokeObjectURL(url);
            };

            // 【改修点1】見出し行の自動除外と未入力データの正しいパース
            const parseData = (input) => {
                if (!input) return [];
                const lines = input.trim().split(/\r?\n/);
                
                // 見出し行とみなすキーワード
                const headerKeywords = ['氏名', '名前', 'クラス', '組', '性別', 'タイム', '時間', '身長', 'チーム指定', 'チーム'];

                return lines.map((line, idx) => {
                    if (!line.trim()) return null;
                    let parts = line.split(/[\t,]+/);
                    if (parts.length < 2 && line.includes(' ')) parts = line.split(/\s+/);
                    parts = parts.map(p => p.trim());
                    if (parts.length < 2) return null;

                    // 見出し行が含まれていればスキップ
                    const isHeader = parts.some(part => headerKeywords.some(kw => part.includes(kw)));
                    if (isHeader) return null;

                    const rawTime = parts[3];
                    const rawHeight = parts[4];

                    // 0や空欄を正しく数値に変換
                    let timeVal = 0;
                    if (rawTime !== undefined && rawTime !== '') {
                        const parsed = parseFloat(rawTime);
                        timeVal = isNaN(parsed) ? 0 : parsed;
                    }

                    let heightVal = 0;
                    if (rawHeight !== undefined && rawHeight !== '') {
                        const parsed = parseFloat(rawHeight);
                        heightVal = isNaN(parsed) ? 0 : parsed;
                    }

                    return {
                        id: idx,
                        name: parts[0] || '',
                        classNum: parts[1] !== undefined && parts[1] !== '' ? parts[1] : '0',
                        gender: parts[2] || '不明',
                        time: timeVal,
                        height: heightVal,
                        fixedTeam: parts[5] || '',
                    };
                }).filter(d => d !== null);
            };

            const requestAssignTeams = () => {
                const students = parseData(rawInput);
                if (students.length === 0) { alert('データを入力してください'); return; }
                setShowPasswordModal(true);
            };

            const onPasswordSuccess = () => {
                setShowPasswordModal(false);
                assignTeams();
            };

            const assignTeams = () => {
                const students = parseData(rawInput);
                // 【改修点3】0を「999」として扱い、最後尾に回すソート処理
                const getSorter = () => criteria === 'time' 
                    ? (a, b) => (a.time === 0 ? 999 : a.time) - (b.time === 0 ? 999 : b.time)
                    : (a, b) => (a.height === 0 ? 999 : a.height) - (b.height === 0 ? 999 : b.height);

                const applyPattern = (list, patternType) => {
                    const sortedList = [...list].sort(getSorter());
                    let patternCounter = 0;

                    sortedList.forEach((student, index) => {
                        if (student.fixedTeam && student.fixedTeam.trim() !== '') {
                            student.team = student.fixedTeam.trim();
                            student.isFixed = true;
                        } else {
                            let autoTeam = '';
                            const mod4 = patternCounter % 4;
                            const mod2 = patternCounter % 2;
                            switch (patternType) {
                                case 'abba': autoTeam = (mod4 === 0 || mod4 === 3) ? '赤' : '白'; break;
                                case 'baab': autoTeam = (mod4 === 0 || mod4 === 3) ? '白' : '赤'; break;
                                case 'abab': autoTeam = (mod2 === 0) ? '赤' : '白'; break;
                                case 'baba': autoTeam = (mod2 === 0) ? '白' : '赤'; break;
                            }
                            student.team = autoTeam;
                            student.isFixed = false;
                            patternCounter++;
                        }
                        student.rankInGroup = index + 1;
                    });
                    return sortedList;
                };

                const processGroup = (groupList) => {
                    if (mode === 'separate') {
                        const boys = groupList.filter(s => /男|M|boy/i.test(s.gender));
                        const girls = groupList.filter(s => !boys.includes(s));
                        return [...applyPattern(boys, ruleBoy), ...applyPattern(girls, ruleGirl)];
                    } else {
                        return applyPattern(groupList, ruleBoy);
                    }
                };

                let processed = [];
                if (grouping === 'class') {
                    const classes = [...new Set(students.map(s => s.classNum))].sort();
                    classes.forEach(cls => {
                        const members = students.filter(s => s.classNum === cls);
                        processed = [...processed, ...processGroup(members)];
                    });
                } else {
                    processed = processGroup(students);
                }
                
                setTeamData(processed);
                setStep(4);
            };

            const generateFinalOutput = () => {
                let races = [];
                if (raceEnabled) {
                    const groups = [];
                    if (raceMode === 'separate') {
                        groups.push({ name: '男子', list: teamData.filter(s => /男|M/i.test(s.gender)) });
                        groups.push({ name: '女子', list: teamData.filter(s => !/男|M/i.test(s.gender)) });
                    } else {
                        groups.push({ name: '混合', list: teamData });
                    }

                    groups.forEach(group => {
                        // 【改修点3-b】徒競走リストでも、0を「999」として扱い最後尾に回す
                        const sorted = [...group.list].sort((a, b) => (a.time === 0 ? 999 : a.time) - (b.time === 0 ? 999 : b.time));
                        let reds = sorted.filter(s => s.team === '赤');
                        let whites = sorted.filter(s => s.team === '白');
                        let raceCount = 1;
                        
                        while (reds.length > 0 || whites.length > 0) {
                            const needed = runnersPerRace;
                            const isOddRace = (raceCount % 2 !== 0);
                            let redTarget = isOddRace ? Math.ceil(needed / 2) : Math.floor(needed / 2);
                            let whiteTarget = isOddRace ? Math.floor(needed / 2) : Math.ceil(needed / 2);

                            let rTake = reds.splice(0, redTarget);
                            let wTake = whites.splice(0, whiteTarget);
                            
                            if (rTake.length + wTake.length < needed) {
                                const shortage = needed - (rTake.length + wTake.length);
                                if (reds.length > 0) rTake = rTake.concat(reds.splice(0, shortage));
                                else if (whites.length > 0) wTake = wTake.concat(whites.splice(0, shortage));
                            }

                            const laneMembers = [];
                            const max = rTake.length + wTake.length;
                            for (let i = 0; i < max; i++) {
                                let member;
                                if (isOddRace) {
                                    if (i % 2 === 0) member = rTake.length ? rTake.shift() : wTake.shift();
                                    else member = wTake.length ? wTake.shift() : rTake.shift();
                                } else {
                                    if (i % 2 === 0) member = wTake.length ? wTake.shift() : rTake.shift();
                                    else member = rTake.length ? rTake.shift() : wTake.shift();
                                }
                                if (member) laneMembers.push(member);
                            }

                            laneMembers.forEach((m, idx) => {
                                races.push({
                                    group: group.name,
                                    raceNo: raceCount,
                                    lane: idx + 1,
                                    ...m
                                });
                            });
                            raceCount++;
                        }
                    });
                }
                setRaceList(races);

                let lineups = [];
                if (lineupEnabled) {
                    const sortFunc = (a, b) => {
                        if (lineupGrouping === 'class' && a.classNum !== b.classNum) return a.classNum - b.classNum;
                        if (lineupMode === 'separate') {
                            const aIsBoy = /男|M/i.test(a.gender);
                            const bIsBoy = /男|M/i.test(b.gender);
                            if (aIsBoy !== bIsBoy) return aIsBoy ? -1 : 1;
                        }
                        if (a.team !== b.team) return a.team === '赤' ? -1 : 1;
                        const aIsBoy = /男|M/i.test(a.gender);
                        const bIsBoy = /男|M/i.test(b.gender);
                        if (aIsBoy !== bIsBoy) return aIsBoy ? -1 : 1;
                        // 【改修点3-c】背の順リストでも、身長0を「999」として扱い最後尾に回す
                        return (a.height === 0 ? 999 : a.height) - (b.height === 0 ? 999 : b.height);
                    };

                    const sortedRaw = [...teamData].sort(sortFunc);
                    
                    const grouped = {};
                    sortedRaw.forEach(s => {
                        let key = s.team; 
                        if (lineupGrouping === 'class') key += `_${s.classNum}組`;
                        else key += `_全体`; 
                        
                        if (!grouped[key]) grouped[key] = [];
                        grouped[key].push(s);
                    });

                    Object.keys(grouped).forEach(key => {
                        const members = grouped[key];
                        const groupName = key.replace('_', ' ');

                        if (lineupMode === 'separate') {
                            const boysCols = Math.floor(lineupColumns / 2) || 1;
                            const girlsCols = lineupColumns - boysCols || 1;
                            const boys = members.filter(s => /男|M/i.test(s.gender));
                            const girls = members.filter(s => !/男|M/i.test(s.gender));

                            let bCount = 0;
                            boys.forEach(s => {
                                s.groupKey = groupName;
                                s.column = (bCount % boysCols) + 1; 
                                s.row = Math.floor(bCount / boysCols) + 1;
                                lineups.push(s);
                                bCount++;
                            });

                            let gCount = 0;
                            girls.forEach(s => {
                                s.groupKey = groupName;
                                s.column = (gCount % girlsCols) + 1 + boysCols; 
                                s.row = Math.floor(gCount / girlsCols) + 1;
                                lineups.push(s);
                                gCount++;
                            });

                        } else {
                            members.forEach((s, i) => {
                                s.groupKey = groupName;
                                s.column = (i % lineupColumns) + 1;
                                s.row = Math.floor(i / lineupColumns) + 1;
                                lineups.push(s);
                            });
                        }
                    });
                }
                setLineupList(lineups);
                setStep(6);
            };

            // --- UI Components ---
            // 【改修点2】未入力・0データを黄色にハイライトするテーブル
            const PreviewTable = ({ inputData }) => {
                const parsed = parseData(inputData);
                if (parsed.length === 0) return null;
                
                const isZeroOrEmpty = (val) => val === 0 || val === '0' || val === '' || val === null || val === undefined;

                return (
                    <div className="mt-4 bg-white rounded-lg border border-green-200 overflow-hidden text-sm animate-fade-in shadow-sm">
                        <div className="bg-green-50 p-3 text-green-800 font-bold border-b border-green-200 flex flex-wrap items-center justify-between gap-2">
                            <div className="flex items-center gap-2">
                                <Icons.Check /> プレビュー (全{parsed.length}名)
                            </div>
                            <div className="text-xs bg-yellow-100 text-yellow-800 px-2.5 py-1 rounded-full border border-yellow-300 font-normal flex items-center gap-1">
                                <span>💡 タイム・身長・クラスが「0」「未入力」の箇所は黄色で表示されます</span>
                            </div>
                        </div>
                        <div className="max-h-96 overflow-y-auto custom-scrollbar">

                                <thead className="bg-green-50 sticky top-0 text-xs text-green-700 uppercase shadow-sm">
                                    <tr>
                                        <th className="p-2 pl-4">氏名</th>
                                        <th className="p-2">クラス</th>
                                        <th className="p-2">性別</th>
                                        <th className="p-2">タイム</th>
                                        <th className="p-2">身長</th>
                                        <th className="p-2 text-red-600">指定</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {parsed.map((r, i) => {
                                        const zeroClass = isZeroOrEmpty(r.classNum);
                                        const zeroTime = isZeroOrEmpty(r.time);
                                        const zeroHeight = isZeroOrEmpty(r.height);
                                        const highlightClass = "bg-yellow-200 font-bold text-amber-900 border-2 border-yellow-400";

                                        return (
                                            <tr key={i} className="border-b bg-white hover:bg-green-50 transition-colors">
                                                <td className="p-2 pl-4 font-bold">{r.name}</td>
                                                <td className={`p-2 rounded ${zeroClass ? highlightClass : ''}`}>
                                                    {r.classNum}
                                                </td>
                                                <td className="p-2">{r.gender}</td>
                                                <td className={`p-2 font-mono rounded ${zeroTime ? highlightClass : ''}`}>
                                                    {r.time}
                                                </td>
                                                <td className={`p-2 font-mono rounded ${zeroHeight ? highlightClass : ''}`}>
                                                    {r.height}
                                                </td>
                                                <td className="p-2 text-red-600 font-bold">{r.fixedTeam}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const ResultTableStep4 = () => {
                const downloadRoster = () => {
                    const wb = XLSX.utils.book_new();
                    const ws = XLSX.utils.json_to_sheet(teamData.map(d => ({
                        "クラス": d.classNum, "チーム": d.team, "氏名": d.name, "性別": d.gender, "タイム": d.time, "身長": d.height, "順位": d.rankInGroup
                    })));
                    XLSX.utils.book_append_sheet(wb, ws, "名簿一覧");
                    XLSX.writeFile(wb, "運動会_名簿一覧.xlsx");
                };

                return (
                    <div className="bg-white rounded-xl shadow-sm border border-green-200 overflow-hidden">
                        <div className="p-4 bg-green-50 border-b border-green-200 flex justify-between items-center">
                            <h3 className="font-bold text-green-800 flex items-center gap-2"><Icons.User/> 振り分け結果一覧</h3>
                            <button onClick={downloadRoster} className="bg-orange-500 hover:bg-orange-600 text-white text-sm px-4 py-2 rounded-lg font-bold flex items-center gap-2 transition shadow-md">
                                <Icons.Download/> 名簿を保存
                            </button>
                        </div>
                        <div className="max-h-80 overflow-y-auto custom-scrollbar">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-green-50 sticky top-0 text-xs text-green-700 uppercase"><tr><th className="p-3 pl-6">クラス</th><th className="p-3">チーム</th><th className="p-3">氏名</th><th className="p-3">性別</th><th className="p-3">順位</th></tr></thead>
                                <tbody>
                                    {teamData.map((d,i)=><tr key={i} className="border-b hover:bg-green-50"><td className="p-3 pl-6">{d.classNum}</td><td className={`p-3 font-bold ${d.team==='赤'?'text-red-500':'text-slate-500'}`}>{d.team}</td><td className="p-3 font-medium">{d.name}</td><td className="p-3">{d.gender}</td><td className="p-3">{d.rankInGroup}</td></tr>)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const FinalResultView = () => {
                const [tab, setTab] = useState('race');

                const downloadRaceData = () => {
                    const wb = XLSX.utils.book_new();
                    const groups = [...new Set(raceList.map(r => r.group))];
                    groups.forEach(grp => {
                        const grpRaces = raceList.filter(r => r.group === grp);
                        const raceNos = [...new Set(grpRaces.map(r => r.raceNo))].sort((a,b)=>a-b);
                        const sheetData = [];
                        raceNos.forEach(rNo => {
                            const runners = grpRaces.filter(r => r.raceNo === rNo).sort((a,b)=>a.lane - b.lane);
                            const row = { "レース": `第${rNo}R` };
                            runners.forEach(r => { row[`コース${r.lane}`] = r.name; });
                            sheetData.push(row);
                        });
                        const ws = XLSX.utils.json_to_sheet(sheetData);
                        XLSX.utils.book_append_sheet(wb, ws, `${grp}_徒競走`);
                    });
                    XLSX.writeFile(wb, "運動会_徒競走リスト.xlsx");
                };

                const downloadLineupData = () => {
                    const wb = XLSX.utils.book_new();
                    const groups = [...new Set(lineupList.map(l => l.groupKey))];
                    groups.forEach(grp => {

                                                        <div key={rNo} className="flex items-start gap-4 p-2 hover:bg-slate-50 rounded-lg transition-colors">
                                                            <div className="w-24 shrink-0 pt-2">
                                                                <span className="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full">
                                                                    第{rNo}レース
                                                                </span>
                                                            </div>
                                                            <div className="flex gap-3">
                                                                {raceList.filter(r=>r.group===grp && r.raceNo===rNo).sort((a,b)=>a.lane-b.lane).map(r => (

                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {tab === 'lineup' && lineupEnabled && (
                                <div className="animate-fade-in">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-bold text-green-800 text-lg">🧍 背の順隊形 (グリッド表示)</h3>
                                        <button onClick={downloadLineupData} className="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-6 rounded-full shadow-lg flex items-center gap-2 transition transform hover:-translate-y-1">
                                            <Icons.Download/> 背の順を保存
                                        </button>
                                    </div>
                                    <div className="grid gap-6 md:grid-cols-2 max-h-96 overflow-y-auto custom-scrollbar p-1">
                                        {[...new Set(lineupList.map(l=>l.groupKey))].map(grp => (
                                            <div key={grp} className="bg-green-50 p-4 rounded-lg border border-green-200 shadow-sm">
                                                <h4 className="font-bold text-green-700 mb-3 flex items-center gap-2">
                                                    <span className={`w-2 h-6 rounded ${grp.includes('赤')?'bg-red-500':'bg-white border border-slate-300'}`}></span>
                                                    {grp.replace('_', ' ')}
                                                </h4>
                                                <div className="grid gap-2" style={{ gridTemplateColumns: `repeat(${lineupColumns}, 1fr)` }}>
                                                    {/* ヘッダー列 */}
                                                    {[...Array(lineupColumns)].map((_, i) => <div key={i} className="text-center text-xs text-green-600 font-bold">{i+1}列</div>)}
                                                    
                                                    {/* データ */}
                                                    {lineupList.filter(l=>l.groupKey===grp).map((l, idx) => (
                                                        <div key={idx} className={`p-2 text-center rounded border text-sm font-bold truncate ${l.team==='赤'?'bg-white text-red-600 border-red-200':'bg-white text-slate-700 border-slate-300'}`} style={{ gridColumn: l.column, gridRow: l.row + 1 }}>
                                                            {l.name}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const StepIndicator = () => {
                const steps = [
                    { n: 1, t: '基本' }, { n: 2, t: 'ルール' }, { n: 3, t: '入力' }, { n: 4, t: '名簿' }, { n: 5, t: '設定' }, { n: 6, t: '完了' }

                return (
                    <div className="mb-8 px-4">

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-5xl mx-auto flex flex-col">
                    <header className="mb-8 text-center animate-fade-in">
                        <h1 className="text-3xl font-black text-green-800 mb-2 tracking-tight flex items-center justify-center gap-3">

                    </header>

                    <StepIndicator />

                    <div className="flex-grow animate-fade-in">
                        {/* STEP 1: 基本条件 */}
                        {step === 1 && (
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-green-200 max-w-3xl mx-auto space-y-8">
                                <h2 className="text-xl font-bold text-green-700 border-b border-green-100 pb-4 flex items-center gap-2"><Icons.Settings/> 基本条件を設定</h2>
                                
                                <div className="space-y-6">
                                    {/* 組み分け単位 */}
                                    <div>
                                        <label className="block text-sm font-bold text-green-600 mb-3 uppercase tracking-wider">組み分け単位</label>
                                        <div className="grid grid-cols-2 gap-4">
                                            <SelectionCard selected={grouping==='grade'} onClick={()=>setGrouping('grade')} icon={Icons.Grade} title="学年全体" desc="クラスに関係なく全体で分けます" />
                                            <SelectionCard selected={grouping==='class'} onClick={()=>setGrouping('class')} icon={Icons.Class} title="クラスごと" desc="各クラス内で均等に分けます" />
                                        </div>
                                    </div>
                                    {/* モード */}
                                    <div>
                                        <label className="block text-sm font-bold text-green-600 mb-3 uppercase tracking-wider">モード</label>
                                        <div className="grid grid-cols-2 gap-4">
                                            <SelectionCard selected={mode==='separate'} onClick={()=>setMode('separate')} icon={Icons.Separate} title="男女別" desc="男女それぞれで順位をつけて分けます" />
                                            <SelectionCard selected={mode==='mixed'} onClick={()=>setMode('mixed')} icon={Icons.Mixed} title="男女混合" desc="性別に関係なく全体で分けます" />
                                        </div>
                                    </div>
                                    {/* 基準 */}
                                    <div>
                                        <label className="block text-sm font-bold text-green-600 mb-3 uppercase tracking-wider">並び替え基準</label>
                                        <div className="grid grid-cols-2 gap-4">
                                            <SelectionCard selected={criteria==='time'} onClick={()=>setCriteria('time')} icon={Icons.Time} title="タイム順" desc="速い順に並び替えます" />
                                            <SelectionCard selected={criteria==='height'} onClick={()=>setCriteria('height')} icon={Icons.Height} title="背の順" desc="低い順に並び替えます" />

                                </div>
                                <div className="text-right pt-4"><button onClick={()=>setStep(2)} className="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-10 rounded-full shadow-lg transition transform hover:-translate-y-1 flex items-center gap-2 ml-auto">次へ <Icons.ArrowRight/></button></div>
                            </div>
                        )}

                        {/* STEP 2: ルール */}
                        {step === 2 && (
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-green-200 max-w-3xl mx-auto space-y-8">

                                <div className="space-y-6">
                                    <div>
                                        <label className="block font-bold text-green-700 mb-3">{mode==='separate'?'男子':'全体'}のパターン</label>
                                        <div className="grid md:grid-cols-2 gap-3">
                                            {PATTERNS.map(p=><SelectionCard key={p.id} selected={ruleBoy===p.id} onClick={()=>setRuleBoy(p.id)} icon={Icons.Check} title={p.name} desc={p.sub} />)}
                                        </div>
                                        <div className="mt-2 text-xs text-green-600 bg-green-50 p-2 rounded text-center">{PATTERNS.find(p=>p.id===ruleBoy)?.desc}</div>
                                    </div>
                                    {mode==='separate' && (
                                        <div>
                                            <label className="block font-bold text-green-700 mb-3 text-pink-600">女子のパターン</label>
                                            <div className="grid md:grid-cols-2 gap-3">
                                                {PATTERNS.map(p=><SelectionCard key={p.id} selected={ruleGirl===p.id} onClick={()=>setRuleGirl(p.id)} icon={Icons.Check} title={p.name} desc={p.sub} color="pink" />)}
                                            </div>
                                            <div className="mt-2 text-xs text-green-600 bg-green-50 p-2 rounded text-center">{PATTERNS.find(p=>p.id===ruleGirl)?.desc}</div>
                                        </div>
                                    )}
                                    <div className="flex justify-between pt-4">
                                        <button onClick={()=>setStep(1)} className="text-green-600 font-bold px-6 py-3 rounded-full hover:bg-green-50 flex items-center gap-2"><Icons.ArrowLeft/> 戻る</button>
                                        <button onClick={()=>setStep(3)} className="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-10 rounded-full shadow-lg transition transform hover:-translate-y-1 flex items-center gap-2">次へ <Icons.ArrowRight/></button>
                                    </div>
                                </div>
                            </div>

                        {/* STEP 3: 入力 */}
                        {step === 3 && (
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-green-200 max-w-4xl mx-auto space-y-6">
                                <h2 className="text-xl font-bold text-green-700 border-b border-green-100 pb-4 flex items-center gap-2"><Icons.User/> データの入力</h2>
                                <div className="flex flex-wrap gap-4 items-center justify-between mb-4 bg-green-50 p-4 rounded-lg border border-green-100">
                                    <div className="text-sm text-green-900 flex-1 min-w-[200px]">
                                        <p className="font-bold mb-1">【Excelからの列コピー順序】</p>
                                        <p className="font-mono text-xs md:text-sm whitespace-nowrap overflow-x-auto">A:氏名 | B:クラス | C:性別 | D:タイム | E:身長 | <span className="text-red-600 font-bold">F:チーム指定</span></p>
                                        <p className="text-xs text-red-500 mt-1 font-bold">※F列に『赤』『白』と入力すると、自動振り分けされずにそのチームになります。</p>
                                        <p className="text-xs text-slate-500 mt-1">※見出し行ごと貼り付けても自動で無視されます。</p>

                                    <div className="flex gap-2">
                                        <button onClick={()=>setRawInput(SAMPLE_DATA)} className="text-xs bg-white text-green-600 border border-green-200 px-3 py-2 rounded shadow-sm hover:bg-green-50 font-bold">サンプル入力</button>
                                        <button onClick={downloadTemplate} className="bg-orange-500 hover:bg-orange-600 text-white text-xs px-3 py-2 rounded shadow-sm flex items-center gap-1 font-bold"><Icons.Download/> 📄 入力用データをダウンロード</button>
                                    </div>

                                <div className="border-2 border-green-200 rounded-lg overflow-hidden focus-within:border-green-400 transition-colors">
                                    <textarea className="w-full h-48 p-4 data-input focus:outline-none" value={rawInput} onChange={(e)=>setRawInput(e.target.value)} placeholder="Excelからコピー＆ペーストしてください..."></textarea>

                                <PreviewTable inputData={rawInput} />
                                <div className="flex justify-between pt-4">
                                    <button onClick={()=>setStep(2)} className="text-green-600 font-bold px-6 py-3 rounded-full hover:bg-green-50 flex items-center gap-2"><Icons.ArrowLeft/> 戻る</button>
                                    <button onClick={requestAssignTeams} className="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-10 rounded-full shadow-lg transition transform hover:-translate-y-1 flex items-center gap-2">組み分け実行 <Icons.ArrowRight/></button>
                                </div>
                            </div>
                        )}

                        {/* STEP 4: 確認 */}
                        {step === 4 && (
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-green-200 max-w-4xl mx-auto space-y-6">
                                <h2 className="text-xl font-bold text-green-700 border-b border-green-100 pb-4 flex items-center gap-2"><Icons.Check/> 結果確認</h2>
                                <div className="bg-green-50 p-4 rounded-lg text-green-800 text-sm border border-green-100 flex items-center gap-2 font-bold">
                                    <Icons.Check/> チーム分けが完了しました。データを確認し、問題なければ出力設定に進んでください。
                                </div>
                                <ResultTableStep4 />
                                <div className="flex justify-between pt-4">
                                    <button onClick={()=>setStep(3)} className="text-green-600 font-bold px-6 py-3 rounded-full hover:bg-green-50 flex items-center gap-2"><Icons.ArrowLeft/> 戻る</button>
                                    <button onClick={()=>setStep(5)} className="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-10 rounded-full shadow-lg transition transform hover:-translate-y-1 flex items-center gap-2">次へ(出力設定) <Icons.ArrowRight/></button>
                                </div>
                            </div>
                        )}

                        {/* STEP 5: 出力設定 */}
                        {step === 5 && (
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-green-200 max-w-3xl mx-auto space-y-8">
                                <h2 className="text-xl font-bold text-green-700 border-b border-green-100 pb-4 flex items-center gap-2"><Icons.Settings/> 出力詳細設定</h2>
                                
                                {/* 徒競走設定 */}
                                <div className="border border-green-200 p-6 rounded-xl bg-green-50 hover:border-green-300 transition-colors">
                                    <label className="font-bold flex items-center gap-3 cursor-pointer mb-4 text-lg text-green-800 border-b border-green-200 pb-2">
                                        <input type="checkbox" checked={raceEnabled} onChange={(e)=>setRaceEnabled(e.target.checked)} className="w-6 h-6 accent-green-600"/>
                                        🏃 徒競走(走順)リストを作成
                                    </label>
                                    {raceEnabled && (
                                        <div className="ml-2 space-y-6 animate-fade-in">
                                            {/* モード選択 */}
                                            <div>
                                                <label className="block text-xs font-bold text-green-600 mb-2 uppercase">モード</label>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <SelectionCard selected={raceMode==='separate'} onClick={()=>setRaceMode('separate')} icon={Icons.Separate} title="男女別" desc="男女分けて走ります" />
                                                    <SelectionCard selected={raceMode==='mixed'} onClick={()=>setRaceMode('mixed')} icon={Icons.Mixed} title="男女混合" desc="混合で走ります" />
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3 bg-white p-3 rounded border border-green-100">
                                                <span className="font-bold text-green-700">1レースあたりの人数:</span>
                                                <input type="number" min="2" max="10" value={runnersPerRace} onChange={(e)=>setRunnersPerRace(Number(e.target.value))} className="border-2 border-green-200 p-2 w-20 text-center rounded-lg font-bold text-lg focus:border-green-500 focus:outline-none"/>
                                                <span className="font-bold text-green-700">人</span>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* 背の順設定 */}
                                <div className="border border-green-200 p-6 rounded-xl bg-green-50 hover:border-green-300 transition-colors">
                                    <label className="font-bold flex items-center gap-3 cursor-pointer mb-4 text-lg text-green-800 border-b border-green-200 pb-2">
                                        <input type="checkbox" checked={lineupEnabled} onChange={(e)=>setLineupEnabled(e.target.checked)} className="w-6 h-6 accent-green-600"/>
                                        🧍 背の順(整列)リストを作成
                                    </label>
                                    {lineupEnabled && (
                                        <div className="ml-2 space-y-6 animate-fade-in">
                                            {/* 単位 */}
                                            <div>
                                                <label className="block text-xs font-bold text-green-600 mb-2 uppercase">① 並び順のグループ単位</label>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <SelectionCard selected={lineupGrouping==='class'} onClick={()=>setLineupGrouping('class')} icon={Icons.Class} title="クラスごと" desc="1組赤, 1組白..." />
                                                    <SelectionCard selected={lineupGrouping==='grade'} onClick={()=>setLineupGrouping('grade')} icon={Icons.Grade} title="学年通し" desc="赤組全体, 白組全体" />
                                                </div>
                                            </div>
                                            {/* モード */}
                                            <div>
                                                <label className="block text-xs font-bold text-green-600 mb-2 uppercase">② 並び方</label>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <SelectionCard selected={lineupMode==='separate'} onClick={()=>setLineupMode('separate')} icon={Icons.Separate} title="男女別列" desc="男子列・女子列に分けます" />
                                                    <SelectionCard selected={lineupMode==='mixed'} onClick={()=>setLineupMode('mixed')} icon={Icons.Mixed} title="男女混合列" desc="混合で並びます" />
                                                </div>
                                            </div>
                                            <div className="bg-white p-3 rounded border border-green-100">
                                                <div className="flex items-center gap-3">
                                                    <span className="font-bold text-green-700">③ 全体の列数 (折り返し):</span>
                                                    <input type="number" min="1" max="20" value={lineupColumns} onChange={(e)=>setLineupColumns(Number(e.target.value))} className="border-2 border-green-200 p-2 w-20 text-center rounded-lg font-bold text-lg focus:border-green-500 focus:outline-none"/>
                                                    <span className="font-bold text-green-700">列</span>
                                                </div>
                                                {lineupMode==='separate' && (
                                                    <p className="text-xs text-green-600 mt-2 font-bold">
                                                        💡 男女別の場合: 男子 {Math.floor(lineupColumns/2) || 1}列 ＋ 女子 {lineupColumns - (Math.floor(lineupColumns/2) || 1)}列 ＝ 合計 {lineupColumns}列 になります。
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="flex justify-between pt-4">
                                    <button onClick={()=>setStep(4)} className="text-green-600 font-bold px-6 py-3 rounded-full hover:bg-green-50 flex items-center gap-2"><Icons.ArrowLeft/> 戻る</button>
                                    <button onClick={generateFinalOutput} className="bg-gradient-to-r from-green-600 to-teal-600 text-white font-bold py-3 px-12 rounded-full shadow-lg hover:from-green-700 hover:to-teal-700 transform hover:-translate-y-1 transition flex items-center gap-2">
                                        <Icons.Check/> 最終リスト作成
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* STEP 6: 完了 */}
                        {step === 6 && (
                            <div className="bg-white p-8 rounded-2xl shadow-xl border border-green-200 max-w-6xl mx-auto space-y-6 animate-fade-in">
                                <h2 className="text-2xl font-black text-green-800 border-b border-green-100 pb-4 flex items-center gap-2 text-transparent bg-clip-text bg-gradient-to-r from-green-600 to-teal-600">
                                    🎉 作成完了
                                </h2>
                                <FinalResultView />
                                <div className="text-center mt-8">
                                    <button onClick={()=>setStep(5)} className="text-slate-500 border-2 border-slate-200 px-6 py-3 rounded-full hover:bg-slate-50 hover:text-slate-700 font-bold transition">設定を変更して再作成</button>
                                </div>
                            </div>
                        )}
                    </div>
                    {showPasswordModal && <PasswordModal 
                        show={showPasswordModal}
                        onClose={() => setShowPasswordModal(false)}
                        onSuccess={onPasswordSuccess}
                    />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
